<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-label="Stock chart illustration">
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="hsl(215.02, 98.39%, 51.18%)" stop-opacity="0.28"/>
      <stop offset="1" stop-color="hsl(215.02, 98.39%, 51.18%)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="finFill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="hsl(213.86, 58.82%, 46.67%)"/>
      <stop offset="1" stop-color="hsl(215.02, 98.39%, 51.18%)"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop -->
  <circle cx="430" cy="110" r="150" fill="hsl(215.02, 98.39%, 51.18%)" opacity="0.07"/>
  <circle cx="120" cy="330" r="95" fill="hsl(156.62, 73.33%, 58.82%)" opacity="0.10"/>

  <!-- main panel -->
  <rect x="40" y="60" width="440" height="300" rx="18" fill="#ffffff" stroke="hsl(215, 30%, 90%)" stroke-width="2"/>

  <!-- panel header -->
  <circle cx="66" cy="88" r="5" fill="hsl(215, 25%, 88%)"/>
  <circle cx="82" cy="88" r="5" fill="hsl(215, 25%, 88%)"/>
  <circle cx="98" cy="88" r="5" fill="hsl(215, 25%, 88%)"/>
  <rect x="380" y="82" width="76" height="12" rx="6" fill="hsl(215, 25%, 93%)"/>

  <!-- ticker label -->
  <text x="64" y="128" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="hsl(215, 35%, 25%)">NASDAQ</text>
  <text x="64" y="150" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="hsl(215, 15%, 60%)">Last 12 months</text>

  <!-- gridlines -->
  <g stroke="hsl(215, 25%, 94%)" stroke-width="1.5">
    <line x1="64" y1="200" x2="456" y2="200"/>
    <line x1="64" y1="245" x2="456" y2="245"/>
    <line x1="64" y1="290" x2="456" y2="290"/>
  </g>

  <!-- volume bars -->
  <g fill="hsl(215.02, 98.39%, 51.18%)" opacity="0.15">
    <rect x="76" y="306" width="10" height="20" rx="3"/>
    <rect x="116" y="300" width="10" height="26" rx="3"/>
    <rect x="156" y="311" width="10" height="15" rx="3"/>
    <rect x="196" y="296" width="10" height="30" rx="3"/>
    <rect x="236" y="304" width="10" height="22" rx="3"/>
    <rect x="276" y="291" width="10" height="35" rx="3"/>
    <rect x="316" y="299" width="10" height="27" rx="3"/>
    <rect x="356" y="286" width="10" height="40" rx="3"/>
    <rect x="396" y="294" width="10" height="32" rx="3"/>
    <rect x="436" y="281" width="10" height="45" rx="3"/>
  </g>

  <!-- area under the line -->
  <path d="M81 272 L121 252 L161 260 L201 228 L241 238 L281 199 L321 209 L361 171 L401 157 L441 129 L441 290 L81 290 Z" fill="url(#areaFill)"/>

  <!-- the line -->
  <path d="M81 272 L121 252 L161 260 L201 228 L241 238 L281 199 L321 209 L361 171 L401 157 L441 129"
        fill="none" stroke="hsl(215.02, 98.39%, 51.18%)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- end point -->
  <circle cx="441" cy="129" r="7" fill="#ffffff" stroke="hsl(215.02, 98.39%, 51.18%)" stroke-width="3.5"/>

  <!-- floating gain badge -->
  <g>
    <rect x="356" y="30" width="132" height="58" rx="14" fill="#ffffff" stroke="hsl(215, 30%, 90%)" stroke-width="2"/>
    <path d="M378 66 L388 52 L398 60 L410 42" fill="none" stroke="hsl(156.62, 73.33%, 58.82%)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M402 42 L410 42 L410 50" fill="none" stroke="hsl(156.62, 73.33%, 58.82%)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="424" y="64" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="hsl(156.62, 53%, 42%)">+18%</text>
  </g>

  <!-- fin motif -->
  <g transform="translate(44, 318)">
    <path d="M8 33 C 16 29, 26 20, 33 6 C 35 18, 33 28, 28 33 Z" fill="url(#finFill)"/>
    <path d="M4 37 C 11 37, 15 36, 22 36 C 30 36, 33 32, 41 27" fill="none" stroke="hsl(156.62, 73.33%, 58.82%)" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
